<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BLE Scale</title>
  <meta name="description" content="Reads the weight from a BLE broadcast scale with Web Bluetooth">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script>
    // Apply the saved theme before the first paint, so the page never flashes the wrong colours.
    try {
      const theme = JSON.parse(localStorage.getItem('ble-scale:theme'));
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch { /* no saved theme */ }
  </script>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="fork">
    <a href="https://github.com/RobertoD91/Analysis-BLE-ES-CS20M" target="_blank" rel="noopener">Fork me on GitHub</a>
  </div>
  <main>
    <header class="top">
      <div>
        <h1 data-i18n="title">BLE Scale</h1>
        <p class="muted" data-i18n="subtitle">Reads the weight from the scale's advertisements, without pairing.</p>
      </div>
      <div class="prefs">
        <div class="toggle" role="group" aria-label="Language" data-i18n-label="language">
          <button type="button" data-lang="en" lang="en">EN</button>
          <button type="button" data-lang="it" lang="it">IT</button>
        </div>
        <div class="toggle" role="group" aria-label="Theme" data-i18n-label="theme">
          <button type="button" data-theme-choice="auto" data-i18n="themeAuto">Auto</button>
          <button type="button" data-theme-choice="light" data-i18n="themeLight">Light</button>
          <button type="button" data-theme-choice="dark" data-i18n="themeDark">Dark</button>
        </div>
      </div>
    </header>

    <section id="reading" class="card reading" data-state="off" aria-live="polite">
      <div class="weight"><span id="weight">--.--</span> <span class="unit">kg</span></div>
      <div id="state" class="state">Not listening</div>
      <dl class="meta">
        <div><dt data-i18n="scale">Scale</dt><dd id="mac">—</dd></div>
        <div><dt data-i18n="signal">Signal</dt><dd id="rssi">—</dd></div>
        <div><dt data-i18n="frames">Frames</dt><dd id="frames">0</dd></div>
      </dl>
    </section>

    <div class="actions">
      <button id="listen" class="primary" type="button" data-i18n="listen">Connect to the scale</button>
      <button id="stop" type="button" data-i18n="stop" hidden>Stop</button>
      <label class="button" for="replay-file" data-i18n="replay">Replay a .pklg capture</label>
      <input id="replay-file" type="file" accept=".pklg" hidden>
    </div>
    <p id="message" class="message" role="status"></p>

    <section class="card">
      <h2 data-i18n="saved">Saved measurements</h2>
      <ol id="history" class="history"></ol>
      <p id="history-empty" class="muted" data-i18n="noSaved">No measurements saved yet.</p>
      <button id="clear-history" class="link" type="button" data-i18n="clearHistory" hidden>Clear history</button>
    </section>

    <details class="card">
      <summary data-i18n="howTo">How to use it</summary>
      <ol class="steps">
        <li data-i18n-html="step1Html"></li>
        <li data-i18n-html="step2Html"></li>
        <li data-i18n-html="step3Html"></li>
        <li data-i18n-html="step4Html"></li>
      </ol>
      <p class="muted" data-i18n="note1"></p>
      <p class="muted" data-i18n-html="note2Html"></p>
    </details>

    <details class="card">
      <summary data-i18n="receivedFrames">Received frames</summary>
      <pre id="log" class="log"></pre>
      <button id="download-log" class="link" type="button" data-i18n="downloadFrames">Download all frames of this session (CSV)</button>
    </details>
  </main>
</body>
</html>
